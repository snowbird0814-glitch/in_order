<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무슨 말인지 알겠어?</title>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080a;
    --card:#141116;
    --accent:#8a1f2b;
    --accent-soft:#8a1f2b33;
    --text:#d8d2d4;
    --sub:#6e6670;
    --ok:#7a8a6e;
    --err:#8a1f2b;
    --input-bg:#1a1620;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at center, #16121a 0%, #08080a 70%);
    color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex;
    justify-content:center;
    padding:32px 16px 80px;
  }
  .wrap{
    width:100%;
    max-width:560px;
  }
  h1{
    font-family:"Song Myung","Nanum Myeongjo",serif;
    font-size:26px;
    text-align:center;
    margin-bottom:8px;
    color:#c9c0c3;
    letter-spacing:1px;
    text-shadow:0 0 10px var(--accent-soft), 0 0 2px #000;
  }
  .desc{
    text-align:center;
    color:var(--sub);
    font-size:13px;
    margin-bottom:24px;
    font-style:italic;
  }
  .progress{
    text-align:center;
    font-size:13px;
    color:var(--accent);
    margin-bottom:18px;
    font-weight:600;
    opacity:0.8;
  }
  .form-card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    display:flex;
    gap:8px;
    margin-bottom:28px;
    border:1px solid #232028;
    box-shadow:0 0 24px #00000080 inset;
  }
  input[type="text"]{
    flex:1;
    background:var(--input-bg);
    border:1px solid #2b2530;
    border-radius:8px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    outline:none;
  }
  input[type="text"]:focus{
    border-color:var(--accent);
  }
  button.submit{
    background:var(--accent);
    color:#e8dede;
    border:none;
    border-radius:8px;
    padding:0 20px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  button.submit:hover{ opacity:0.85; }

  .entry{
    background:var(--card);
    border-radius:var(--radius);
    padding:18px 20px;
    margin-bottom:14px;
    border:1px solid #232028;
    box-shadow:0 0 20px #00000090 inset;
    animation:fadeIn 0.45s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .entry-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .entry-title{
    font-family:"Song Myung","Nanum Myeongjo",serif;
    font-weight:400;
    font-size:16px;
    color:var(--accent);
    letter-spacing:0.5px;
  }
  .entry-content{
    font-size:14px;
    line-height:1.7;
    color:var(--text);
    white-space:pre-line;
  }
  .copy-btn{
    background:none;
    border:1px solid #302a34;
    color:var(--sub);
    border-radius:6px;
    padding:4px 10px;
    font-size:12px;
    cursor:pointer;
  }
  .copy-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .locked-list{
    color:var(--sub);
    font-size:12px;
    text-align:center;
    margin-top:8px;
  }
  .all-done{
    text-align:center;
    color:var(--ok);
    font-weight:700;
    margin:20px 0;
    font-size:15px;
    font-family:"Song Myung","Nanum Myeongjo",serif;
  }
  .back-btn{
    width:100%;
    margin-top:14px;
    background:none;
    border:1px solid #302a34;
    color:var(--sub);
    border-radius:8px;
    padding:12px;
    font-size:14px;
    cursor:pointer;
  }
  .back-btn:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>무슨 말인지 알겠어?</h1>
  <div class="desc">옳은 답을 말하면 내가 본 걸 알려주지</div>
  <div class="progress" id="progress">0 / 9 발견</div>

  <div class="form-card" id="formCard">
    <input type="text" id="answerInput" placeholder="정답 입력..." autocomplete="off">
    <button class="submit" id="submitBtn">확인</button>
  </div>

  <div id="resultView" style="display:none;"></div>
  <div id="allDone" class="all-done" style="display:none;">전부 알아버렸군</div>
</div>

<script>
// ---- 데이터 ----
const quizData = [
  { time:"09:00", who:"스바루", answers:["눈의꽃"],
    content:"09:00 스바루 - 절연의 나무\n젠지가 잃어버린 줄 알고 찾아주려고" },
  { time:"10:00", who:"하쿠", answers:["러브어택","러브어텍"],
    content:"10:00 하쿠 - 비밀의 방\n젠지한테 장난치려고" },
  { time:"11:00", who:"지로", answers:["청춘만화"],
    content:"11:00 지로 - 몰트크랑켄 내 진료실\n진료실에서 자신의 몸을 치료하려는데 방해되어서" },
  { time:"12:00", who:"로미오", answers:["하입보이"],
    content:"12:00 로미오 - 부대장실 사무실\n팔려고" },
  { time:"13:00", who:"카이토", answers:["타임캡슐"],
    content:"13:00 카이토 - 도박장\n도박에서 이겼는데, 이긴 상품에 섞여있어서" },
  { time:"14:00", who:"미오", answers:["창귀"],
    content:"14:00 미오 - 작업실\n연구하고 싶어서" },
  { time:"15:00", who:"라이카", answers:["투유"],
    content:"15:00 라이카 - 옵스큐어리 숲\n미미하게 특기생 냄새가 나서" },
  { time:"16:00", who:"미도", answers:["블루문"],
    content:"16:00 미도 - 경기장\n그냥" },
  { time:"17:00", who:"렌", answers:["몰라"],
    content:"17:00 렌 - 식당(다이너)\n하루가 장난친 줄 알고 하루 얼굴에 던져버리려고" }
];

const STORAGE_KEY = "td9_event_quiz_unlocked";

// ---- 정답 정규화: 공백 제거 + ㅐ/ㅔ 표기 흔들림 통일 ----
function normalize(str){
  let s = str.replace(/\s/g,"");
  let out = "";
  for (const ch of s){
    const code = ch.codePointAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3){
      const idx = code - 0xAC00;
      const jong = idx % 28;
      const jung = Math.floor(idx / 28) % 21;
      const cho = Math.floor(idx / 28 / 21);
      // jung index 1 = ㅐ, 5 = ㅔ  -> 통일
      const newJung = (jung === 1 || jung === 5) ? 1 : jung;
      out += String.fromCodePoint(0xAC00 + (cho*21 + newJung)*28 + jong);
    } else {
      out += ch.toLowerCase();
    }
  }
  return out;
}

// 미리 정규화해둔 정답 맵
const answerMap = [];
quizData.forEach((q, i) => {
  q.answers.forEach(a => answerMap.push({ norm: normalize(a), index: i }));
});

function getUnlocked(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){ return []; }
}
function saveUnlocked(arr){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
}

function updateProgress(){
  const unlocked = getUnlocked();
  document.getElementById("progress").textContent = `${unlocked.length} / ${quizData.length} 발견`;
  document.getElementById("allDone").style.display =
    (unlocked.length === quizData.length) ? "block" : "none";
}

function showForm(){
  document.getElementById("formCard").style.display = "flex";
  document.getElementById("resultView").style.display = "none";
  document.getElementById("answerInput").value = "";
  document.getElementById("answerInput").focus();
}

function showResult(index){
  const q = quizData[index];
  document.getElementById("formCard").style.display = "none";

  const view = document.getElementById("resultView");
  view.style.display = "block";
  view.innerHTML = `
    <div class="entry">
      <div class="entry-head">
        <div class="entry-title">${q.time} ${q.who}</div>
        <button class="copy-btn" id="copyBtn">복사</button>
      </div>
      <div class="entry-content">${q.content}</div>
    </div>
    <button class="back-btn" id="backBtn">입력란으로 돌아가기</button>
  `;

  document.getElementById("copyBtn").addEventListener("click", () => {
    navigator.clipboard.writeText(q.content).then(() => {
      const btn = document.getElementById("copyBtn");
      const original = btn.textContent;
      btn.textContent = "복사됨!";
      setTimeout(() => { btn.textContent = original; }, 1200);
    });
  });

  document.getElementById("backBtn").addEventListener("click", showForm);
}

function handleSubmit(){
  const input = document.getElementById("answerInput");
  const raw = input.value.trim();
  if (!raw) return;

  const norm = normalize(raw);
  const found = answerMap.find(a => a.norm === norm);

  if (!found){
    alert("그건 정답이 아니야!");
    return;
  }

  const unlocked = getUnlocked();
  if (!unlocked.includes(found.index)){
    unlocked.push(found.index);
    saveUnlocked(unlocked);
    updateProgress();
  }

  showResult(found.index);
}

document.getElementById("submitBtn").addEventListener("click", handleSubmit);
document.getElementById("answerInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleSubmit();
});

updateProgress();
</script>
</body>
</html>
