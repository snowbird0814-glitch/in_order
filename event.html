<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>이벤트 스토리</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: manipulation;
    }

    #viewer {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #story-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-select: none;
      pointer-events: none;
    }

    #tap-layer {
      position: absolute;
      inset: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #end-screen {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    #end-screen.show {
      display: flex;
    }

    #end-msg {
      color: #fff;
      font-size: 18px;
      font-family: sans-serif;
      opacity: 0.8;
    }

    #restart-btn {
      color: #fff;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 24px;
      padding: 10px 28px;
      font-size: 15px;
      font-family: sans-serif;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="viewer">
  <img id="story-img" src="" alt="">
  <div id="tap-layer"></div>
  <div id="end-screen">
    <p id="end-msg">✦ 끝 ✦</p>
    <button id="restart-btn">처음으로</button>
  </div>
</div>

<script>
  /* ── 이미지 순서 정의 ── */
  const seq = [
    ...Array.from({length: 34}, (_, i) => String(i + 1).padStart(2, '0')),
    '14',
    ...Array.from({length: 10}, (_, i) => String(i + 35).padStart(2, '0')),
    '14'
  ];
  // → 01~34, 14, 35~44, 14  (총 47장)

  const IMG_PATH = ''; // 이미지 폴더 경로
  const EXT = '.png';

  let current = 0;
  let ended = false;

  const img       = document.getElementById('story-img');
  const tapLayer  = document.getElementById('tap-layer');
  const endScreen = document.getElementById('end-screen');
  const restartBtn= document.getElementById('restart-btn');

  /* ── 이미지 로드 ── */
  function loadImage(index) {
    if (index >= seq.length) {
      showEnd();
      return;
    }
    img.src = IMG_PATH + seq[index] + EXT;

    // 다음 이미지 preload
    if (index + 1 < seq.length) {
      const pre = new Image();
      pre.src = IMG_PATH + seq[index + 1] + EXT;
    }
  }

  function showEnd() {
    ended = true;
    img.style.display = 'none';
    tapLayer.style.display = 'none';
    endScreen.classList.add('show');
  }

  function restart() {
    ended = false;
    current = 0;
    img.style.display = 'block';
    tapLayer.style.display = 'block';
    endScreen.classList.remove('show');
    loadImage(0);
  }

  /* ── 더블탭/더블클릭 감지 ── */
  let lastTap = 0;
  const DOUBLE_TAP_DELAY = 300; // ms

  function handleDoubleTap() {
    if (ended) return;
    current++;
    loadImage(current);
  }

  // 터치
  tapLayer.addEventListener('touchend', (e) => {
    e.preventDefault();
    const now = Date.now();
    if (now - lastTap < DOUBLE_TAP_DELAY) {
      handleDoubleTap();
      lastTap = 0;
    } else {
      lastTap = now;
    }
  }, { passive: false });

  // 마우스(PC)
  tapLayer.addEventListener('dblclick', () => {
    handleDoubleTap();
  });

  restartBtn.addEventListener('click', restart);

  /* ── 초기 로드 ── */
  loadImage(0);
</script>
</body>
</html>
