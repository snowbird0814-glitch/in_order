<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>길드 공지 생성기</title>
<style>
  :root {
    --bg: #f4f4f2;
    --surface: #ffffff;
    --border: #ddd;
    --border2: #e8e8e8;
    --text: #1a1a1a;
    --text-dim: #888;
    --midnight: #2a5cff;
    --evening: #e86a1a;
    --input-bg: #fafafa;
    --radius: 6px;
    --mono: 'Courier New', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 500px; margin: 0 auto; }

  .site-header {
    display: flex; align-items: baseline; gap: 10px;
    margin-bottom: 20px; padding-bottom: 14px;
    border-bottom: 2px solid var(--text);
  }
  .site-title { font-size: 1rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
  .site-date { font-size: .8rem; color: var(--text-dim); font-family: var(--mono); }

  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
  }
  .section-title { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 12px; }

  .field-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .field-row:last-child { margin-bottom: 0; }
  .field-label { font-size: .84rem; color: var(--text-dim); width: 72px; flex-shrink: 0; }
  .field-input {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: .9rem;
    padding: 7px 10px; outline: none; transition: border-color .15s;
    font-family: var(--mono); width: 80px;
  }
  .field-input:focus { border-color: var(--text); }
  .field-note { font-size: .78rem; color: var(--text-dim); }

  .fish-badge { font-size: .74rem; padding: 3px 8px; border-radius: 3px; font-weight: 700; }
  .fish-badge.full  { background: #e6f7d9; color: #3a7d00; }
  .fish-badge.lack  { background: #fff0e0; color: #b85a00; }
  .fish-badge.empty { background: #eee;    color: #999; }

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .btn {
    padding: 12px 0; border: none; border-radius: var(--radius);
    font-size: .84rem; font-weight: 700; letter-spacing: .04em;
    cursor: pointer; transition: opacity .15s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-midnight { background: var(--midnight); color: #fff; }
  .btn-evening  { background: var(--evening);  color: #fff; }
  .btn:hover { opacity: .85; }

  .output-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .output-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border2); }
  .output-label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .output-label.midnight { color: var(--midnight); }
  .output-label.evening  { color: var(--evening); }
  .char-count { font-size: .72rem; font-family: var(--mono); color: var(--text-dim); }
  .char-count.warn { color: #cc2200; font-weight: 700; }
  .output-text {
    padding: 14px; font-family: var(--mono); font-size: .84rem;
    line-height: 1.75; white-space: pre-wrap; word-break: break-all;
    color: var(--text); min-height: 80px;
  }
  .output-text.empty { color: var(--text-dim); font-style: italic; font-family: inherit; font-size: .82rem; }
  .copy-btn {
    width: 100%; padding: 9px; background: var(--bg); border: none;
    border-top: 1px solid var(--border2); color: var(--text-dim);
    font-size: .78rem; font-weight: 700; letter-spacing: .06em;
    cursor: pointer; transition: background .15s, color .15s; text-transform: uppercase;
  }
  .copy-btn:hover { background: var(--border2); color: var(--text); }
  .copy-btn.copied { color: #3a7d00; }

  .config-toggle {
    display: flex; align-items: center; gap: 8px;
    font-size: .78rem; color: var(--text-dim); cursor: pointer;
    margin-bottom: 8px; user-select: none;
  }
  .config-toggle:hover { color: var(--text); }
  .config-panel { display: none; }
  .config-panel.open { display: block; }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-header">
    <span class="site-title">길드 공지</span>
    <span class="site-date" id="headerDate"></span>
  </header>

  <!-- 날짜 + 낚시 입력 -->
  <div class="section">
    <div class="section-title">날짜 / 낚시 현황</div>
    <div class="field-row">
      <span class="field-label">날짜</span>
      <input class="field-input" type="date" id="selectedDate" style="width:150px" oninput="updateHeader()">
    </div>
    <div class="field-row">
      <span class="field-label">낚시 인원</span>
      <input class="field-input" type="number" id="fishCount" placeholder="46" min="0" max="99" oninput="updateBadge()">
      <span class="field-note">/</span>
      <span class="field-note" id="guildSizeDisplay" style="font-family:var(--mono)">46</span>
      <span class="fish-badge empty" id="fishBadge">-</span>
    </div>
  </div>

  <!-- 냥코 상황 선택 -->
  <div class="section">
    <div class="section-title">냥코 상황 선택</div>
    <div class="field-row">
      <span class="field-label">자정</span>
      <select class="field-input" id="midnightNyanko" style="width:auto;flex:1;font-family:inherit;font-size:.82rem">
        <option value="">— 선택 안 함 - 냥코)</option>
        <option value="냥코) 냥코, 냥즈 전부 이대로 유지 선포x">냥코, 냥즈 전부 유지 선포x</option>
        <option value="냥코) 냥코 선포x, 냥즈 [  ] 선포(아침에 부탁!!)">냥코 선포x, 냥즈 [  ]선포(아침에 부탁!!)</option>
        <option value="냥코) 냥코 [  ] 선포, 냥즈 선포x(아침에 부탁!!)">냥코 [  ]선포, 냥즈 선포x(아침에 부탁!!)</option>
        <option value="냥코) 냥코, 냥즈 선포 공지 운영회의 후 곧 전달!">냥코, 냥즈 선포 공지 곧 전달!</option>
      </select>
    </div>
    <div class="field-row">
      <span class="field-label">저녁</span>
      <select class="field-input" id="eveningNyanko" style="width:auto;flex:1;font-family:inherit;font-size:.82rem">
        <option value="">— 선택 안 함 (빈 냥코)</option>
        <option value="냥코) 냥코, 냥즈 방어배치 자율">냥코, 냥즈 방어배치 자율</option>
        <option value="냥코) 냥코 [  ] 배치, 냥즈 [  ] 배치">냥코 [  ]배치, 냥즈 [  ]배치</option>
        <option value="냥코) 냥코 [  ] 배치, 냥즈 배치 자율">냥코 [  ]배치, 냥즈 배치 자율</option>
        <option value="냥코) 냥코 배치 자율, 냥즈 [  ] 배치">냥코 배치 자율, 냥즈 [  ]배치</option>
      </select>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-midnight" onclick="generate('midnight')">자정 공지 생성</button>
    <button class="btn btn-evening"  onclick="generate('evening')">저녁 공지 생성</button>
  </div>

  <div class="output-card">
    <div class="output-header">
      <span class="output-label midnight">자정 공지</span>
      <span class="char-count" id="charMidnight"></span>
    </div>
    <div class="output-text empty" id="outputMidnight">생성 버튼을 누르면 여기에 공지가 나와요</div>
    <button class="copy-btn" id="copyMidnight" onclick="copyText('midnight')">복사</button>
  </div>

  <div class="output-card">
    <div class="output-header">
      <span class="output-label evening">저녁 공지</span>
      <span class="char-count" id="charEvening"></span>
    </div>
    <div class="output-text empty" id="outputEvening">생성 버튼을 누르면 여기에 공지가 나와요</div>
    <button class="copy-btn" id="copyEvening" onclick="copyText('evening')">복사</button>
  </div>

  <div class="config-toggle" onclick="toggleConfig()">
    <span id="cfgArrow">▶</span> 설정 (길드 정원 / 기준일)
  </div>
  <div class="config-panel" id="configPanel">
    <div class="section">
      <div class="section-title">상수 설정</div>
      <div class="field-row">
        <span class="field-label">길드 정원</span>
        <input class="field-input" type="number" id="guildSize" value="46" min="1" max="99" oninput="syncGuildSize()">
        <span class="field-note" style="font-size:.72rem">낚시 풀인원 기준</span>
      </div>
      <div class="field-row">
        <span class="field-label">기준일</span>
        <input class="field-input" type="date" id="cfgBaseDate" value="2026-04-06" style="width:150px">
        <span class="field-note" style="font-size:.72rem">냥코 마지막날(월요일)</span>
      </div>
    </div>
  </div>

</div>
<script>
// ============================================================
// 유틸
// ============================================================

// 선택된 날짜 반환 (없으면 오늘)
function getSelectedDate() {
  const val = document.getElementById('selectedDate').value;
  if (!val) return new Date();
  // YYYY-MM-DD를 로컬 자정 기준으로 파싱
  const [y, m, d] = val.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getDateHeader(d) {
  const y   = String(d.getFullYear()).slice(2);
  const m   = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + m + day;
}

function getGuildSize() {
  return parseInt(document.getElementById('guildSize').value) || 46;
}

// 격주 사이클 (기준일 = 냥코 마지막날, 월요일)
// cycle 0=마지막날(월), 1=쉬는날(화), 2=리셋+선포(수), 3~13=일반
function getGuildCycle(d) {
  const base = new Date(document.getElementById('cfgBaseDate').value);
  base.setHours(0, 0, 0, 0);
  const t = new Date(d);
  t.setHours(0, 0, 0, 0);
  const diff = Math.round((t - base) / 86400000);
  return ((diff % 14) + 14) % 14;
}

// ============================================================
// 자정 냥코줄
// cycle=1(화): 조사 기능 안내
// cycle=2(수): 냥코+냥즈 리셋 안내
// 나머지: 빈 냥코)
// ============================================================
function getMidnightNyanco(d) {
  const cycle = getGuildCycle(d);
  if (cycle === 1) return '냥코) 내일 냥코 리셋! 조사패스 5~10 사용(선포권 챙기기)';
  if (cycle === 2) return '냥코) 냥코 리셋일! 선포 공지 운영회의 후 바로 안내\n-오늘 냥즈 리셋! 선포공지 동일!';
  return '냥코)';
}

// ============================================================
// 자정 기타줄
// 화/목: 신규 카드
// 수/토: 경험치 2배 합숙 2/5시간
// 목/일: 경험치 2.5배 합숙 2/5/10시간
// 매달 1일: 우물 오는 날
// 13~17일 금: 중순 우물 + 금맥 이벤트
// ============================================================
function getMidnightKita(d) {
  const dow  = d.getDay();
  const date = d.getDate();
  const lines = [];

  if (dow === 2 || dow === 5) lines.push('신규 카드 나오는 날(금맥/깃털/물감 정오 전 수확)');
  if (dow === 3 || dow === 6) lines.push('경험치 2배Day! 합숙 2/5시간 티켓 털기');
  if (dow === 4 || dow === 0) lines.push('경험치 2.5배Day! 합숙 2/5/10 티켓 전부 털기');
  if (date === 1)             lines.push('월초 우물 오는 날! & 다이아 사용 이벤트');
  if (dow === 5 && date >= 13 && date <= 17) lines.push('중순 우물! & 금맥 장비 이벤트');

  return lines;
}

// ============================================================
// 저녁 냥코줄
// 월(매주): 냥즈 마무리
// 월(cycle=0 격주): 냥코 마무리 + 냥즈 마무리
// 나머지: 빈 냥코)
// ============================================================
function getEveningNyanco(d) {
  const dow   = d.getDay();
  const cycle = getGuildCycle(d);

  if (dow === 1) {
    if (cycle === 0) {
      return '냥코) 오늘 냥코 마무리! 방어 배치 필수(보수 챙기기)\n-오늘 냥즈 마무리! (보수챙기세요!)';
    }
    return '냥코) 오늘 냥즈 마무리! (보수챙기세요!)';
  }
  return '냥코)';
}

// ============================================================
// 저녁 기타줄
// 월(매주): 콜로세움 마감일
// 화(매주): 콜로세움 오픈
// 나머지: 없음
// ============================================================
function getEveningKita(d) {
  const dow = d.getDay();
  const lines = [];

  if (dow === 1) lines.push('콜로세움 마감일, 21:00 전에 전부 돌기');
  if (dow === 2) lines.push('콜로세움 22:00 오픈, 자정 전에 횟수 소진하기');

  return lines;
}

// ============================================================
// 공지 조합
// ============================================================
function buildNotice(time) {
  const d         = getSelectedDate();
  const guildSize = getGuildSize();
  const fishInput = document.getElementById('fishCount').value;
  const fishCount = fishInput === '' ? null : parseInt(fishInput);
  const full      = fishCount !== null && fishCount >= guildSize;
  const fishDisplay = fishCount !== null ? `${fishCount}/${guildSize}` : `?/${guildSize}`;

  let fishLine;
  if (time === 'midnight') {
    if (fishCount === null)  fishLine = `일퀘) 낚시 ${fishDisplay}`;
    else if (full)           fishLine = `일퀘) 낚시 ${fishDisplay}\n-풀낚시 감사합니다! 내일도 홧팅!`;
    else                     fishLine = `일퀘) 낚시 ${fishDisplay} 오늘 조금 아쉽\n-내일은 풀낚시 아자아자!`;
  } else {
    if (fishCount === null)  fishLine = `일퀘) 낚시 ${fishDisplay}`;
    else if (full)           fishLine = `일퀘) 낚시 ${fishDisplay}\n-보수 바로 배포!!`;
    else                     fishLine = `일퀘) 낚시 ${fishDisplay}\n-풀낚시 바로 배포, 아닐시 20:30 이후 배포`;
  }

  let parts;
  if (time === 'midnight') {
    const kitaLines = getMidnightKita(d);
    // 드롭다운 선택값 있으면 우선, 없으면 자동 냥코줄
    const midnightSel = document.getElementById('midnightNyanko').value;
    const nyanco = midnightSel || getMidnightNyanco(d);
    parts = [getDateHeader(d), nyanco, fishLine];
    if (kitaLines.length > 0) parts.push('기타) ' + kitaLines.join('\n-'));
  } else {
    const eveningKita = getEveningKita(d);
    // 드롭다운 선택값 있으면 우선, 없으면 자동 냥코줄
    const eveningSel = document.getElementById('eveningNyanko').value;
    const nyanco = eveningSel || getEveningNyanco(d);
    parts = [getDateHeader(d), nyanco, fishLine];
    if (eveningKita.length > 0) parts.push('기타) ' + eveningKita.join('\n-'));
  }

  return parts.join('\n');
}

// ============================================================
// UI
// ============================================================
function generate(time) {
  const text   = buildNotice(time);
  const outEl  = document.getElementById(time === 'midnight' ? 'outputMidnight' : 'outputEvening');
  const charEl = document.getElementById(time === 'midnight' ? 'charMidnight'   : 'charEvening');
  outEl.textContent = text;
  outEl.classList.remove('empty');
  const len = text.length;
  charEl.textContent = `${len}자`;
  charEl.className = 'char-count' + (len > 280 ? ' warn' : '');
}

function copyText(time) {
  const outEl = document.getElementById(time === 'midnight' ? 'outputMidnight' : 'outputEvening');
  const btn   = document.getElementById(time === 'midnight' ? 'copyMidnight'   : 'copyEvening');
  if (outEl.classList.contains('empty')) return;
  navigator.clipboard.writeText(outEl.innerText).then(() => {
    btn.textContent = '복사됨!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '복사'; btn.classList.remove('copied'); }, 1800);
  });
}

function updateBadge() {
  const guildSize = getGuildSize();
  const val  = document.getElementById('fishCount').value;
  const badge = document.getElementById('fishBadge');
  if (val === '') {
    badge.textContent = '-';     badge.className = 'fish-badge empty';
  } else if (parseInt(val) >= guildSize) {
    badge.textContent = '풀낚시'; badge.className = 'fish-badge full';
  } else {
    badge.textContent = '미완료'; badge.className = 'fish-badge lack';
  }
}

function updateHeader() {
  const d = getSelectedDate();
  document.getElementById('headerDate').textContent = getDateHeader(d);
}

function syncGuildSize() {
  document.getElementById('guildSizeDisplay').textContent = document.getElementById('guildSize').value || '46';
  updateBadge();
}

function toggleConfig() {
  const panel = document.getElementById('configPanel');
  panel.classList.toggle('open');
  document.getElementById('cfgArrow').textContent = panel.classList.contains('open') ? '▼' : '▶';
}

// 초기화: 오늘 날짜 기본값 세팅
(function init() {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  document.getElementById('selectedDate').value = `${y}-${m}-${d}`;
  document.getElementById('headerDate').textContent = getDateHeader(today);
})();
</script>
</body>
</html>
